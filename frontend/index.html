<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Q&amp;A</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M8 5v14l11-7z" fill="currentColor" />
          </svg>
        </div>
        <span class="brand-name">Video Q&amp;A</span>
      </div>

      <div class="new-video">
        <input type="text" id="url-input" placeholder="Paste a YouTube link..." />
        <button id="ingest-btn"><span>Ingest</span></button>
      </div>
      <p id="ingest-status" class="status"></p>

      <div class="sidebar-section-label">Videos</div>
      <div id="video-list" class="video-list">
        <p class="empty-state small">No videos yet.</p>
      </div>
    </aside>

    <main class="chat-area">
      <header id="chat-header" class="chat-header" hidden>
        <img id="now-playing-thumb" alt="" />
        <span id="now-playing-title"></span>
      </header>

      <div id="chat-log">
        <p class="empty-state">Ingest or pick a video on the left, then ask away.</p>
      </div>

      <div class="composer">
        <input type="text" id="question-input" placeholder="Ask something about the video..." disabled />
        <button id="ask-btn" disabled><span>Send</span></button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
